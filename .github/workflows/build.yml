name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Workspace Files
        run: |
          echo "Kiểm tra các tệp ở thư mục gốc:"
          ls -la

      - name: Build App for Generic iOS Device
        run: |
          # Build trực tiếp tệp xcodeproj tại thư mục gốc
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          # Đóng gói thành tệp .ipa
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/ThreeOneOSFive.app build/Payload/
          cd build
          zip -r ThreeOneOSFive.ipa Payload
          
          mkdir -p ../output
          mv ThreeOneOSFive.ipa ../output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: output/ThreeOneOSFive.ipa
