name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Build Project
        run: |
          # Kiểm tra cấu trúc thư mục để debug
          ls -la
          
          # Tìm tệp .xcodeproj xem nó nằm ở thư mục gốc hay thư mục con
          PROJECT_FILE=$(find . -name "ThreeOneOSFive.xcodeproj" -maxdepth 2)
          echo "Found project at: $PROJECT_FILE"
          
          # Lấy thư mục chứa project
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          
          # Thực hiện build
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          # Đóng gói IPA
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/ThreeOneOSFive.app build/Payload/
          cd build
          zip -r ThreeOneOSFive.ipa Payload
          mkdir -p ../../output
          mv ThreeOneOSFive.ipa ../../output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: output/ThreeOneOSFive.ipa
